[package]
name = "ramo-native"
version = "0.3.0-dev.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Rust-native Ramo workbench development slice"

[dependencies]
ab_glyph = "=0.2.32"
ramo-core = { package = "ramo", path = "../../src-tauri", default-features = false }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["metal", "vulkan", "dx12", "wgsl"] }
egui-phosphor = "=0.11.0"
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSArray"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }

[profile.release]
lto = "thin"
strip = true
