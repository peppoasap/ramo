[package]
name = "ramo"
version = "0.2.0-beta.3"
description = "An independent graphical Git desktop client"
authors = ["Ramo contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "ramo_core"
path = "src/lib.rs"

[[bin]]
name = "ramo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", optional = true , features = [] }
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

